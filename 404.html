<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      sessionStorage.redirect = location.href;

      location.replace(
        location.origin +
        "/marketplace-react/" +
        "?redirect=" +
        encodeURIComponent(
          location.pathname +
          location.search +
          location.hash
        )
      );
    </script>
  </head>

  <body></body>
</html>
