<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        sessionStorage.setItem("redirect", location.href);
      } catch (e) {}

      var pathname = location.pathname;
      var basePath = pathname.includes("/marketplace-react") ? "/marketplace-react/" : "/";

      location.replace(
        location.origin +
        basePath +
        "?redirect=" +
        encodeURIComponent(
          location.pathname +
          location.search +
          location.hash
        )
      );
    </script>
  </head>

  <body></body>
</html>
